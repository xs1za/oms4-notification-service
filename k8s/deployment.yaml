apiVersion: apps/v1
kind: Deployment
metadata:
  name: oms4
  namespace: oms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oms4
  template:
    metadata:
      labels:
        app: oms4
    spec:
      containers:
        - name: oms4
          image: oms4:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: oms4-config
            - secretRef:
                name: oms4-secret
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            timeoutSeconds: 5
            periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oms4-email-worker
  namespace: oms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oms4-email-worker
  template:
    metadata:
      labels:
        app: oms4-email-worker
    spec:
      containers:
        - name: oms4-email-worker
          image: oms4:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.email_worker"]
          envFrom:
            - configMapRef:
                name: oms4-config
            - secretRef:
                name: oms4-secret
